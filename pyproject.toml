[project]
name = "fem2d"
version = "0.1.0"
description = ""
authors = [
    {name = "JohannBouwer", email = "68966619+JohannBouwer@users.noreply.github.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.2",
    "matplotlib>=3.10.0",
    "scipy>=1.15.1",
    "ipykernel>=6.0.0",
]

[project.optional-dependencies]
# Gradient enhanced RBF surrogates, used by fem2d.surrogate and the research
# notebook that optimises with them. Optional because it pulls in scikit-learn,
# which nothing else here needs, and because the surrogates are one way of using
# the sensitivities rather than part of the finite element code.
surrogate = ["ge_rbf>=0.2"]

[tool.uv.sources]
# Not on PyPI. Keeping the requirement above plain and the location here is uv's
# own pattern, and leaves the published metadata free of a direct reference.
ge_rbf = { git = "https://github.com/JohannBouwer/GE_RBF.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fem2d"]

[tool.ruff]
line-length = 120
src = ["src"]
extend-exclude = ["notebooks", "research"]  # generated, and their outputs are not ours to lint

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "G",    # logging format
    "RET",  # return
]
ignore = [
    # This codebase deliberately uses PascalCase for methods, parameters and
    # locals, matching the finite element notation it implements, so the
    # pep8-naming rules are not enabled at all.
    "E741",  # ambiguous names: l, I and O read naturally in this notation
    "E226",  # missing whitespace around arithmetic: formulae are denser without
    "E731",  # lambda assignment
    # Naming a result before returning it is deliberate here: the name matches
    # the Returns section of the docstring, which is how the formulae are
    # cross referenced against the derivation.
    "RET504",
]

[tool.ruff.lint.per-file-ignores]
"src/fem2d/elements/__init__.py" = ["E402"]  # registration must follow the imports
